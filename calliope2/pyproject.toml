[tool.uv.workspace]
members = ["apps/api", "apps/cli"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "aiosqlite>=0.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP", "SIM", "TCH", "TID", "Q", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["calliope2", "calliope2_cli"]

[tool.ruff.lint.per-file-ignores]
# FastAPI evaluates Annotated[T, Depends(...)] aliases at runtime; Pydantic v2
# resolves schema field types via get_type_hints when model_validate runs.
# Both require dependency-related and field-type imports at module level.
"apps/api/calliope2/api/**/*.py" = ["TC001", "TC002", "TC003"]
# Pytest fixtures resolve return-type annotations at runtime in some configs;
# keep helper imports at module level to avoid surprise.
"apps/api/tests/conftest.py" = ["TC002", "TC003"]
# Typer reads parameter type annotations at runtime to validate CLI args.
"apps/cli/calliope2_cli/commands/**/*.py" = ["TC001", "TC002", "TC003"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "apps/cli/tests", "tests"]
