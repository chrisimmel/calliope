[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calliope2"
version = "0.1.0"
description = "Calliope v2 — modernized FastAPI service for generative-story experiences."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "tenacity>=9.0",
    "httpx>=0.27",
    "aiofiles>=24.1",
    "loguru>=0.7",
    "firebase-admin>=6.5",
    "google-cloud-storage>=2.18",
    "openai>=1.50",
    "replicate>=1.0",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["calliope2"]
