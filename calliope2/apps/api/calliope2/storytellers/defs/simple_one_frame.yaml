name: simple_one_frame
description: |
  Minimal text+image baseline: generate a short narrative paragraph, then
  illustrate it. Takes an optional `theme` input variable.
steps:
  - generate_text:
      provider: openai
      model: gpt-4o-mini
      prompt: prompts/simple_one_frame/narrate.j2
      out: frame_text
  - generate_image:
      provider: openai
      model: gpt-image-1
      prompt: "{{ frame_text }}"
      out: frame_image
output:
  text: frame_text
  image: frame_image
