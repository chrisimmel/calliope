name: echo
description: |
  Spoken-word seed. Transcribes a `source_audio` recording, then continues a
  story from what was said and illustrates it with the default cinematic_photo
  illustrator. The audio analog of `narcissus` (which seeds from an image).
  Requires a `source_audio` input — the web client's "Begin from: Spoken words"
  capture, submitted as a base64 `data:audio/...` URL.

  Multi-frame: the API threads `previous_text` from the most recent frame; the
  first frame opens a new story from the transcript.

illustrator: cinematic_photo

steps:
  - transcribe:
      provider: openai
      model: whisper-1
      input: source_audio
      out: spoken_text

  - generate_text:
      provider: openai
      model: gpt-4.1
      prompt: prompts/echo/narrate.j2
      out: frame_text

  - use_illustrator:
      inputs:
        source: "{{ frame_text }}"
      out: frame_image

output:
  text: frame_text
  image: frame_image
